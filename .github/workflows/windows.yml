name: windows

on:
  push:
    paths: ["windows/**", "server/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "server/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test windows/tests/SharedClipboard.Core.Tests

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish (self-contained)
        run: dotnet publish windows/src/SharedClipboard -c Release -o windows/dist -warnaserror -p:Version=1.0.${{ github.run_number }}
      - name: Publish (small, needs .NET Desktop Runtime)
        run: dotnet publish windows/src/SharedClipboard -c Release -o windows/dist-small -p:SelfContained=false -p:EnableCompressionInSingleFile=false -warnaserror -p:Version=1.0.${{ github.run_number }}
      - name: Build clipd for the smoke test
        working-directory: server
        run: go build -o clipd.exe .
      - name: Smoke test (self-contained)
        shell: pwsh
        run: windows/tools/smoke.ps1 -Exe windows/dist/SharedClipboard.exe -Clipd server/clipd.exe -Out smoke -Name full
      - name: Smoke test (small)
        if: always()
        shell: pwsh
        run: windows/tools/smoke.ps1 -Exe windows/dist-small/SharedClipboard.exe -Clipd server/clipd.exe -Out smoke -Name small
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: SharedClipboard
          path: windows/dist/SharedClipboard.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SharedClipboard-small
          path: windows/dist-small/SharedClipboard.exe
      - name: Prepare release files
        if: github.ref_name == 'claude/shared-clipboard-app-wi9m82' || github.ref_name == 'main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item windows/dist/SharedClipboard.exe release/SharedClipboard.exe
          Copy-Item windows/dist-small/SharedClipboard.exe release/SharedClipboard-small.exe
          '{"version": ${{ github.run_number }}, "commit": "${{ github.sha }}"}' | Set-Content -Encoding ascii release/version.json
      - name: Publish to the "windows-latest" release
        if: github.ref_name == 'claude/shared-clipboard-app-wi9m82' || github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Общий буфер для Windows (последняя сборка)
          prerelease: true
          body: |
            Последняя сборка программы для ПК и ноутбука. Коммит ${{ github.sha }}.
            SharedClipboard.exe — полная версия, ничего устанавливать не нужно (~65 МБ).
            SharedClipboard-small.exe — маленькая, нужна .NET 8 Desktop Runtime.
          files: |
            release/SharedClipboard.exe
            release/SharedClipboard-small.exe
            release/version.json
