name: android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk SharedClipboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SharedClipboard-apk
          path: android/SharedClipboard.apk
      - name: Publish to the "android-latest" release
        if: github.ref_name == 'claude/shared-clipboard-app-wi9m82' || github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Общий буфер для Android (последняя сборка)
          prerelease: true
          body: |
            Последняя сборка приложения для телефона. Коммит ${{ github.sha }}.
            Скачайте SharedClipboard.apk на телефон и установите.
          files: android/SharedClipboard.apk
